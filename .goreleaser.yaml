# GoReleaser v2 (master spec §8.3). Snapshots (scripts/release-snapshot.sh) publish nothing and need no token: the
# cask is written to dist/ only. A tag release (the workspace's go step, on the build Mac with GITHUB_TOKEN from
# `gh auth token`) creates the GitHub release with the archive and commits Casks/hommy.rb to the tap as the noreply
# identity. No tap-write secret lives in Actions.
version: 2
project_name: hommy

builds:
  - id: hommy
    main: ./cmd/hommy
    binary: hommy
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/AlexDobrushskiy/hommy/internal/version.Version={{ .Version }}

archives:
  - id: hommy
    ids: [hommy]
    formats: [tar.gz]
    name_template: "hommy_{{ .Version }}_darwin_arm64"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ if index .Env "HOMMY_VERSION" }}{{ index .Env "HOMMY_VERSION" }}{{ else }}{{ incpatch .Version }}-dev{{ end }}'

changelog:
  # snapshots: none; a tag release takes its notes from CHANGELOG.md (--release-notes; a disabled changelog drops them)
  disable: "{{ .IsSnapshot }}"

release:
  github:
    owner: AlexDobrushskiy
    name: hommy
  name_template: "hommy {{ .Tag }}"
  prerelease: auto
  mode: keep-existing
  # a resumed go (`--go --from release`) re-uploads over the assets of its earlier attempt instead of failing on a 422
  replace_existing_artifacts: true

homebrew_casks:
  - name: hommy
    ids: [hommy]
    binaries: [hommy]
    homepage: https://github.com/AlexDobrushskiy/hommy
    description: Voice-note errands from Telegram, run by Claude Code on your Mac
    license: MIT
    skip_upload: false # tags only: a snapshot never publishes
    # The release asset of the public go. A snapshot install (install.sh --source) points its local tap's copy at
    # the archive in DIR/dist/ instead.
    url:
      template: "https://github.com/AlexDobrushskiy/hommy/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: AlexDobrushskiy
      name: homebrew-tap
    commit_author:
      name: AlexDobrushskiy
      email: 4486815+AlexDobrushskiy@users.noreply.github.com
    hooks:
      post:
        # Homebrew's declarative postflight_steps; {{staged_path}} is Homebrew's token, escaped from GoReleaser.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/hommy"]
          end
